apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: novamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/devopsnoman/novamart-backend:latest
          envFrom:
            - configMapRef:
                name: novamart-config
            - secretRef:
                name: novamart-secrets
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: novamart
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: backend