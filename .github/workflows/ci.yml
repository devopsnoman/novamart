name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t novamart-backend:ci ./backend
      - run: docker build -t novamart-frontend:ci ./frontend
  
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Create .env with random secrets
        run: |
          node -e "const c=require('crypto');console.log('POSTGRES_PASSWORD='+c.randomBytes(16).toString('hex'));console.log('JWT_SECRET='+c.randomBytes(48).toString('hex'))" > .env
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: timeout 120 sh -c 'until curl -sf http://localhost:4000/api/health/ready; do sleep 2; done'
      - name: Seed sample data
        run: docker compose run --rm backend node src/db/seed.js
      - name: Run the API smoke test
        run: node backend/scripts/smoke.js
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v